<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101014"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WOD TIMER"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon-192.png"><title>WOD TIMER</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><img src="icon-192.png" alt="WOD TIMER"><div><strong>WOD TIMER</strong><small>3 · 2 · 1 · GO</small></div></div><span class="tag">EMOM</span></header><section id="timer" class="view active"><div class="panel hero"><div class="eyebrow" id="state">READY TO WORK</div><h1 id="workoutTitle">Chelsea</h1><div class="clock" id="clock">30:00</div><div class="progress"><div id="progressFill"></div></div><div class="stats"><div><small>ROUND</small><strong id="round">0 / 30</strong></div><div><small>NEXT ROUND</small><strong id="nextRound">01:00</strong></div></div></div><div class="panel"><div class="sectiontitle">TODAY'S WORKOUT</div><div id="exerciseSummary"></div></div><div class="actions"><button id="start" class="primary">시작</button><button id="reset" class="secondary">초기화</button></div><p class="hint">화면을 켜둔 상태에서 사용해 줘. 화면 잠금이나 다른 앱 전환 중에는 소리·진동이 보장되지 않아.</p></section><section id="settings" class="view"><div class="sectiontitle big">운동 설정</div><div class="panel form"><label>운동 이름<input id="name" maxlength="50" placeholder="Chelsea"></label><div class="cols"><label>총 운동 시간 (분)<input id="minutes" type="number" min="1" max="120"></label><label>라운드 간격 (초)<input id="interval" type="number" min="15" max="300"></label></div><label>준비 카운트다운 (초)<input id="prep" type="number" min="0" max="30"></label></div><div class="panel"><div class="sectiontitle">운동 종목</div><div id="exerciseEditor"></div><button id="addExercise" class="outline wide">+ 운동 추가</button></div><div class="panel form"><div class="sectiontitle">알림 설정</div><label class="toggle">매 라운드 알림음 <input id="sound" type="checkbox"></label><label class="toggle">3·2·1 카운트다운 <input id="countdown" type="checkbox"></label><label class="toggle">진동 (지원 기기) <input id="vibration" type="checkbox"></label><label class="toggle">화면 켜짐 유지 (지원 기기) <input id="wake" type="checkbox"></label><label>알림음 크기 <input id="volume" type="range" min="0" max="100"></label><button id="testSound" class="outline wide">알림음 테스트</button></div><div class="panel"><div class="sectiontitle">프리셋</div><button id="savePreset" class="outline wide">현재 설정 프리셋 저장</button><div id="presetList"></div><button id="chelsea" class="secondary wide">정식 Chelsea 불러오기</button></div></section><section id="calendar" class="view"><div class="sectiontitle big">운동 달력</div><div class="panel"><div class="monthbar"><button id="prevMonth" class="ghost">‹</button><strong id="monthTitle"></strong><button id="nextMonth" class="ghost">›</button></div><div class="calgrid" id="calgrid"></div></div><div class="panel" id="dayDetails"></div></section><section id="history" class="view"><div class="sectiontitle big">운동 기록</div><div id="historyList"></div><div class="panel"><div class="sectiontitle">기록 백업</div><p class="hint">기록은 이 기기의 브라우저에 저장돼. 기기 변경 전에는 백업 파일을 내려받아 줘.</p><div class="actions"><button id="export" class="outline">백업 내보내기</button><label class="upload">백업 가져오기<input id="import" type="file" accept="application/json,.json" hidden></label></div></div></section></main><nav><button data-tab="timer" class="selected"><span>◷</span>타이머</button><button data-tab="settings"><span>⚙</span>설정</button><button data-tab="calendar"><span>▦</span>달력</button><button data-tab="history"><span>☷</span>기록</button></nav><script src="app.js?v=2" defer></script></body></html>
